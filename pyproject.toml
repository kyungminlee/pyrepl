[project]
name = "pyrepl-framework"
version = "0.2.0"
description = "A split-screen, asynchronous REPL framework for Python using curses and typer."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Kyungmin Lee" }
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrepl"]
